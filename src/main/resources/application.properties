spring.application.name=prod-ready-fearures
spring.datasource.url=jdbc:mysql://localhost:3306/prod-ready-features
spring.datasource.username=root
spring.datasource.password=Choose_A_Strong_Password_123!
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=com/codingshuttle/prod_ready_fearures/dto

server.port=9000
employeeService.base.url=http://localhost:8080/

#logging configuration
logging.level.com.codingshuttle.prod_ready_fearures.clients=TRACE
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} --- %msg%n
logging.file.name=application.log

#acutator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.abcd=pqrs
info.app.author=Satya Teja K
info.app.version=1.0.0
info.app.documentation=https://codingshuttle.com/docs
management.endpoint.env.show-values=always
management.endpoint.env.roles=admin
management.info.build.enabled=true
management.info.git.enables=true
management.info.java.enabled=true
management.info.os.enabled=true